name: Update train times

# Runs every 10 minutes (GitHub may run it a few minutes late).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write      # needed so the job can commit trains.json

concurrency:
  group: update-trains
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch LNER departures
        env:
          RDM_CONSUMER_KEY: ${{ secrets.RDM_CONSUMER_KEY }}
        run: python scripts/fetch_trains.py

      - name: Save trains.json if it changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add trains.json
          git diff --cached --quiet || (git commit -m "Update train times" && git push)
