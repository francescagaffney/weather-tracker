<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Tracker – Leeds</title>
<style>
  :root {
    --bg1: #dbe7f5; --bg2: #f3f7fc; --card: #ffffff; --ink: #14233b; --muted: #4a5d78;
    --accent: #1f6fd1; --take: #b4431c; --maybe: #9a6a00; --leave: #1d7f4e; --line: #e3ebf5;
    --rain: #5b9bd5; --heat: #e0703a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #0f1d33; --bg2: #16233b; --card: #1b2a45; --ink: #f1f6ff; --muted: #b9c8de;
      --accent: #7fb6ff; --take: #ff9b73; --maybe: #f5c451; --leave: #6fd3a0; --line: #2a3d5e;
      --rain: #7fb6ff; --heat: #ffb07f;
    }
  }
  /* Mood: the page changes with the weather */
  body.mood-sun { --bg1: #ffe9b8; --bg2: #fff9ef; }
  body.mood-night { --bg1: #0b1628; --bg2: #17284a; --card: #1b2a45; --ink: #f1f6ff; --muted: #b9c8de; --line: #2a3d5e; }

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); min-height: 100vh;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    transition: background .8s ease;
  }
  .rain {
    position: fixed; inset: 0; pointer-events: none; opacity: .35; z-index: 0;
    background-image: repeating-linear-gradient(105deg, transparent 0 18px, var(--rain) 18px 19px);
    animation: fall 1.4s linear infinite;
  }
  body.mood-rain .rain { opacity: .7; animation-duration: .7s; }
  body.mood-sun .rain, body.mood-night .rain { opacity: .08; }
  @keyframes fall { from { background-position: 0 0; } to { background-position: -40px 60px; } }

  .wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .brand { font-weight: 700; font-size: 1.1rem; }
  .brand span { margin-right: 6px; display: inline-block; animation: bob 3s ease-in-out infinite; }
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: .95rem; }
  button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--card);
    border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: transform .15s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); margin: 28px 0 0; letter-spacing: -.02em; }
  h1 small { color: var(--muted); font-weight: 400; }
  .date { color: var(--muted); margin: 4px 0 20px; font-size: 1.05rem; }
  .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
  .status { color: var(--muted); min-height: 1.2em; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid.two { grid-template-columns: 1fr 1fr; } }
  .card {
    background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 8px 30px rgba(20,35,59,.08);
    margin-bottom: 16px; animation: rise .5s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .muted { color: var(--muted); }

  /* Hero */
  .hero { display: flex; gap: 18px; align-items: center; }
  .hero-icon { font-size: 3.4rem; line-height: 1; cursor: pointer; display: inline-block; flex: 0 0 auto; }
  .hero h2 { margin: 0 0 4px; font-size: 2rem; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.05rem; }
  .quip { margin-top: 8px !important; font-style: italic; color: var(--ink) !important; }
  .take h2 { color: var(--take); } .maybe h2 { color: var(--maybe); } .leave h2 { color: var(--leave); }
  .wiggle { animation: wiggle 2.4s ease-in-out infinite; }
  .bob { animation: bob 2s ease-in-out infinite; }
  .spin { animation: spin 8s linear infinite; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .rain, .wiggle, .bob, .spin, .tl-bar, .card, .brand span { animation: none !important; }
  }

  /* Burst of raindrops when you tap the hero icon */
  .drop {
    position: fixed; z-index: 5; pointer-events: none; font-size: 1.3rem;
    animation: drop 1s ease-out forwards;
  }
  @keyframes drop {
    from { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; }
  }

  /* Right now */
  .now-main { display: flex; align-items: center; gap: 14px; }
  .big-icon { font-size: 4rem; }
  .temp { font-size: 4.5rem; font-weight: 800; line-height: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat { background: var(--bg2); border-radius: 14px; padding: 10px; }
  .stat small { display: block; color: var(--muted); font-size: .85rem; }
  .stat b { font-size: 1.1rem; }

  /* Packing chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: var(--bg2); border-radius: 999px; padding: 6px 12px; font-size: .95rem; }
  .chip-btn { box-shadow: none; padding: 6px 12px; border-radius: 999px; background: var(--bg2); }
  .chip-btn.packed { background: var(--leave); color: #fff; text-decoration: line-through; }

  /* Rain timeline */
  .timeline {
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; height: 150px;
  }
  .tl-col { display: flex; flex-direction: column; align-items: center; font-size: .72rem; color: var(--muted); min-width: 0; }
  .tl-track { flex: 1; width: 100%; display: flex; align-items: flex-end; background: var(--bg2); border-radius: 10px; overflow: hidden; }
  .tl-bar {
    width: 100%; background: linear-gradient(180deg, var(--accent), var(--rain));
    border-radius: 10px 10px 0 0; transform-origin: bottom; animation: grow .6s ease both;
  }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .tl-col span { margin-top: 4px; white-space: nowrap; }

  /* Hour strip */
  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 10px; scroll-snap-type: x mandatory; }
  .hour {
    flex: 0 0 84px; text-align: center; background: var(--bg2); border-radius: 16px; padding: 12px 6px;
    scroll-snap-align: start; box-shadow: none; color: var(--ink); transition: transform .15s ease, outline-color .15s;
  }
  .hour:hover { transform: translateY(-3px); }
  .hour.selected { outline: 2px solid var(--accent); }
  .hour span, .hour small { display: block; color: var(--muted); font-size: .85rem; }
  .hour .ico { font-size: 1.6rem; margin: 6px 0; }
  .detail { animation: rise .3s ease both; }
  .detail-main { display: flex; align-items: center; gap: 14px; }
  .detail-temp { font-size: 2.4rem; font-weight: 800; }
  .meter { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
  .meter .bar { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--rain), var(--accent)); transition: width .5s ease; }

  /* Table and chart */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
  td.r, th.r { text-align: right; }
  tbody tr:hover { background: var(--bg2); }
  .chart-wrap { overflow-x: auto; }
  svg text { fill: var(--muted); font-size: 12px; }
  svg rect, svg circle { cursor: pointer; }
  .legend { display: flex; gap: 16px; color: var(--muted); font-size: .9rem; margin-bottom: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .log { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; }
  .log li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .badge { font-weight: 700; font-size: .9rem; }
  .Right { color: var(--leave); } .Wrong { color: var(--take); } .Pending, .Fair { color: var(--muted); }
  footer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="rain" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand"><span>🌦️</span>Weather Tracker</div>
    <div class="toolbar">
      <span id="updated">Not updated yet</span>
      <button id="tempUnit" type="button" title="Switch between °C and °F">°C</button>
      <button id="windUnit" type="button" title="Switch between mph and km/h">mph</button>
      <button id="refresh" type="button">↻ Refresh</button>
    </div>
  </header>

  <h1 id="place">Leeds <small>, UK</small></h1>
  <div class="date" id="date"></div>
  <div class="status" id="status" role="status" aria-live="polite">Loading the latest Leeds weather…</div>

  <div id="app"></div>
</div>

<script>
const LAT = 53.8008, LON = -1.5491, TZ = 'Europe%2FLondon';
const REFRESH_MS = 10 * 60 * 1000;
const CALLS_KEY = 'wt-umbrella-calls', LAST_KEY = 'wt-last-forecast', UNITS_KEY = 'wt-units';
const FC_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&timezone=${TZ}`
  + `&wind_speed_unit=mph&temperature_unit=celsius&past_days=8&forecast_days=7`
  + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day`
  + `&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code`
  + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max`;
const AQ_URL = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&timezone=${TZ}&current=european_aqi`;

const WX = {
  0:['Clear','☀️'], 1:['Mostly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
  45:['Fog','🌫️'], 48:['Fog','🌫️'],
  51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌧️'], 56:['Freezing drizzle','🌧️'], 57:['Freezing drizzle','🌧️'],
  61:['Light rain','🌦️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'], 66:['Freezing rain','🌧️'], 67:['Freezing rain','🌧️'],
  71:['Light snow','🌨️'], 73:['Snow','🌨️'], 75:['Heavy snow','❄️'], 77:['Snow grains','🌨️'],
  80:['Showers','🌦️'], 81:['Showers','🌧️'], 82:['Heavy showers','⛈️'], 85:['Snow showers','🌨️'], 86:['Snow showers','🌨️'],
  95:['Thunderstorm','⛈️'], 96:['Thunderstorm','⛈️'], 99:['Thunderstorm','⛈️']
};
const QUIPS = {
  take: ['Brolly time, love.', "Don't leave home without it today.", 'Leeds has spoken: bring the brolly.'],
  maybe: ['The sky is still making its mind up.', 'Could go either way. Pack it just in case.'],
  leave: ['Dry as a bone for now. Leave it at home.', 'Blue skies, or near enough. Go on, leave it.']
};

const $ = id => document.getElementById(id);
const r = n => Math.round(n);
const wx = code => WX[code] || ['Unknown', '🌡️'];
let state = null;

// ---------- units (saved in this browser) ----------
function loadUnits() {
  try { return Object.assign({ temp: 'C', wind: 'mph' }, JSON.parse(localStorage.getItem(UNITS_KEY) || '{}')); }
  catch (e) { return { temp: 'C', wind: 'mph' }; }
}
let units = loadUnits();
function saveUnits() { try { localStorage.setItem(UNITS_KEY, JSON.stringify(units)); } catch (e) { /* skip */ } }
const T = c => units.temp === 'F' ? c * 9 / 5 + 32 : c;
const TU = () => units.temp === 'F' ? '°F' : '°C';
const W = mph => units.wind === 'kmh' ? mph * 1.609 : mph;
const WU = () => units.wind === 'kmh' ? 'km/h' : 'mph';
function updateUnitButtons() {
  $('tempUnit').textContent = TU();
  $('windUnit').textContent = WU();
}

// ---------- helpers ----------
async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
// "2026-11-19T12:00" -> "12pm"
function hourLabel(str) {
  const h = +str.slice(11, 13);
  return (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? 'am' : 'pm');
}
function dayLabel(dateStr, k) {
  if (k === 0) return 'Today';
  if (k === 1) return 'Tomorrow';
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function aqLabel(v) {
  if (v <= 20) return 'Good'; if (v <= 40) return 'Fair'; if (v <= 60) return 'Moderate';
  if (v <= 80) return 'Poor'; if (v <= 100) return 'Very poor'; return 'Extremely poor';
}
function uvLabel(v) {
  if (v < 3) return 'Low'; if (v < 6) return 'Moderate'; if (v < 8) return 'High'; if (v < 11) return 'Very high'; return 'Extreme';
}
function currentIndex(data) {
  const key = data.current.time.slice(0, 13);
  return Math.max(0, data.hourly.time.findIndex(t => t.slice(0, 13) === key));
}
function todayIndex(data) {
  return Math.max(0, data.daily.time.indexOf(data.current.time.slice(0, 10)));
}
function quipFor(level) {
  const list = QUIPS[level] || [''];
  return list[Math.floor(Date.now() / 86400000) % list.length];
}

// ---------- umbrella rules (next 12 hours) ----------
function verdict(data, i) {
  const h = data.hourly;
  const end = Math.min(i + 12, h.time.length);
  let maxP = -1, maxIdx = i;
  for (let j = i; j < end; j++) {
    if (h.precipitation_probability[j] > maxP) { maxP = h.precipitation_probability[j]; maxIdx = j; }
  }
  if (data.current.precipitation > 0.1)
    return { level: 'take', icon: '☂️', label: 'Take it', reason: "It's raining now, so take it.", quip: quipFor('take') };
  if (maxP >= 60)
    return { level: 'take', icon: '☂️', label: 'Take it', reason: `Showers likely around ${hourLabel(h.time[maxIdx])} (${maxP}% chance), so take it.`, quip: quipFor('take') };
  if (maxP >= 30)
    return { level: 'maybe', icon: '🌦️', label: 'Maybe take it', reason: `A ${maxP}% chance of rain around ${hourLabel(h.time[maxIdx])}. Keep it handy.`, quip: quipFor('maybe') };
  return { level: 'leave', icon: '🌞', label: 'Leave it', reason: `Rain looks unlikely over the next 12 hours (highest chance ${maxP}%).`, quip: quipFor('leave') };
}

// ---------- saved umbrella calls (browser only) ----------
function loadCalls() {
  try { return JSON.parse(localStorage.getItem(CALLS_KEY) || '[]'); } catch (e) { return []; }
}
function saveCalls(calls) {
  try { localStorage.setItem(CALLS_KEY, JSON.stringify(calls.slice(-200))); } catch (e) { /* skip */ }
}
function recordCall(data, i, v) {
  const calls = loadCalls();
  const key = data.hourly.time[i];
  if (!calls.some(c => c.key === key)) calls.push({ key, label: v.label, result: null });
  saveCalls(calls);
}
function checkCalls(data) {
  const calls = loadCalls();
  const h = data.hourly;
  const nowIdx = currentIndex(data);
  calls.forEach(c => {
    if (c.result) return;
    const idx = h.time.indexOf(c.key);
    if (idx < 0 || idx + 12 > nowIdx) return;
    const rained = h.precipitation.slice(idx, idx + 12).some(p => p >= 0.2);
    if (c.label === 'Take it') c.result = rained ? 'Right' : 'Wrong';
    else if (c.label === 'Leave it') c.result = rained ? 'Wrong' : 'Right';
    else c.result = 'Fair call';
  });
  saveCalls(calls);
  return calls;
}

// ---------- packing checklist (per day, saved in this browser) ----------
function packedKey() { return 'wt-packed-' + new Date().toLocaleDateString('en-CA'); }
function loadPacked() {
  try { return JSON.parse(localStorage.getItem(packedKey()) || '[]'); } catch (e) { return []; }
}
function togglePacked(chip) {
  const list = loadPacked();
  const name = chip.dataset.item;
  const i = list.indexOf(name);
  if (i >= 0) list.splice(i, 1); else list.push(name);
  try { localStorage.setItem(packedKey(), JSON.stringify(list)); } catch (e) { /* skip */ }
  chip.classList.toggle('packed', i < 0);
  chip.setAttribute('aria-pressed', String(i < 0));
}

// ---------- visuals ----------
function rainTimeline(h, i) {
  const cols = [];
  for (let k = 0; k < 12; k++) {
    const idx = i + k;
    if (idx >= h.time.length) break;
    const p = h.precipitation_probability[idx];
    const label = k === 0 ? 'Now' : hourLabel(h.time[idx]);
    cols.push(`<div class="tl-col" title="${label}: ${p}% chance of rain">
      <div class="tl-track"><div class="tl-bar" style="height:${Math.max(4, p)}%;animation-delay:${k * 40}ms"></div></div>
      <span>${label}</span></div>`);
  }
  return `<div class="timeline">${cols.join('')}</div>`;
}
function detailHTML(data, idx, i) {
  const h = data.hourly;
  const p = h.precipitation_probability[idx];
  const label = idx === i ? 'Now' : hourLabel(h.time[idx]);
  const [txt, ico] = wx(h.weather_code[idx]);
  return `
    <div class="detail-main">
      <span class="big-icon">${ico}</span>
      <div>
        <p class="eyebrow">${label}</p>
        <div class="detail-temp">${r(T(h.temperature_2m[idx]))}${TU()}</div>
        <p class="muted" style="margin:0">${txt} · feels like ${r(T(h.apparent_temperature[idx]))}${TU()}</p>
      </div>
    </div>
    <div class="meter"><span>Chance of rain</span><div class="bar"><i style="width:${p}%"></i></div><b>${p}%</b></div>
    <p class="muted" style="margin:0">Expected rain: ${h.precipitation[idx].toFixed(1)} mm</p>`;
}
function drawChart(d, t) {
  const idxs = [];
  for (let k = t - 7; k <= t; k++) if (k >= 0 && d.temperature_2m_max[k] != null) idxs.push(k);
  if (idxs.length < 2) return '<p class="muted">Not enough history yet.</p>';
  const W_ = 640, H = 230, P = 34;
  const names = idxs.map(k => k === t ? 'Today' : new Date(d.time[k] + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short' }));
  const temps = idxs.map(k => T(d.temperature_2m_max[k]));
  const rains = idxs.map(k => d.precipitation_sum[k] || 0);
  const tMin = Math.min(...temps) - 2, tMax = Math.max(...temps) + 2;
  const rMax = Math.max(5, ...rains);
  const x = n => P + n * (W_ - 2 * P) / (idxs.length - 1);
  const y = v => H - P - (v - tMin) / (tMax - tMin) * (H - 2 * P);
  const barW = (W_ - 2 * P) / idxs.length * 0.45;
  const bars = rains.map((v, n) => {
    const hgt = v / rMax * (H - 2 * P);
    return `<rect x="${x(n) - barW / 2}" y="${H - P - hgt}" width="${barW}" height="${hgt}" rx="4" fill="var(--rain)" opacity=".55">
      <title>${names[n]}: ${v.toFixed(1)} mm of rain</title></rect>`;
  }).join('');
  const line = temps.map((v, n) => `${x(n)},${y(v)}`).join(' ');
  const dots = temps.map((v, n) => `<circle cx="${x(n)}" cy="${y(v)}" r="5" fill="var(--heat)">
    <title>${names[n]}: high of ${r(v)}${TU()}</title></circle>`).join('');
  const labels = names.map((nm, n) => `<text x="${x(n)}" y="${H - 10}" text-anchor="middle">${nm}</text>`).join('');
  return `
    <div class="legend">
      <span><i class="dot" style="background:var(--heat)"></i>High temperature (${TU()})</span>
      <span><i class="dot" style="background:var(--rain)"></i>Rain that day (mm)</span>
    </div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W_} ${H}" width="100%" role="img" aria-label="Temperature and rain for the past week">
        ${bars}
        <polyline points="${line}" fill="none" stroke="var(--heat)" stroke-width="3" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>
    </div>`;
}
// Count numbers up from zero
function animateNumbers() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, suffix = el.dataset.suffix || '';
    const start = performance.now(), dur = 700;
    const step = now => {
      const p = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(to * p) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
// Raindrop burst when the hero icon is tapped
function burst(el) {
  const rect = el.getBoundingClientRect();
  const icons = ['💧', '☔', '✨', '💦'];
  for (let n = 0; n < 12; n++) {
    const d = document.createElement('span');
    d.className = 'drop';
    d.textContent = icons[n % icons.length];
    d.style.left = (rect.left + rect.width / 2) + 'px';
    d.style.top = (rect.top + rect.height / 2) + 'px';
    d.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    d.style.setProperty('--dy', (-Math.random() * 160 - 40) + 'px');
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1000);
  }
}
function selectHour(idx) {
  if (!state) return;
  state.sel = idx;
  const i = currentIndex(state.data);
  document.querySelectorAll('.hour').forEach(b => b.classList.toggle('selected', +b.dataset.idx === idx));
  $('detail').innerHTML = detailHTML(state.data, idx, i);
}

// ---------- main render ----------
function render() {
  const { data, aq } = state;
  const cur = data.current, h = data.hourly, d = data.daily;
  const i = currentIndex(data), t = todayIndex(data);
  const v = verdict(data, i);
  recordCall(data, i, v);
  const calls = checkCalls(data);

  // Mood of the page
  const maxP12 = Math.max(...h.precipitation_probability.slice(i, i + 12));
  document.body.className = !cur.is_day ? 'mood-night'
    : (cur.precipitation > 0.1 || maxP12 >= 60) ? 'mood-rain'
    : cur.weather_code <= 1 ? 'mood-sun' : '';

  // Clothing and packing
  const feels = h.apparent_temperature.slice(i, i + 24);
  const minF = Math.min(...feels), maxF = Math.max(...feels);
  const rainP24 = Math.max(...h.precipitation_probability.slice(i, i + 24));
  const uv = d.uv_index_max[t];
  let title = 'Light clothing';
  if (minF < 5) title = 'Wrap up warm'; else if (minF < 10) title = 'Bring a coat'; else if (minF < 16) title = 'Layers are your friend';
  const wear = [];
  if (v.level !== 'leave') wear.push(['☂️', 'Umbrella']);
  if (minF < 10) wear.push(['🧥', 'Coat']);
  if (minF < 14) wear.push(['🧶', 'Jumper']);
  if (uv >= 3) wear.push(['🕶️', 'Sunglasses'], ['🧴', 'Sunscreen']);
  if (rainP24 >= 40) wear.push(['🥾', 'Waterproof shoes']);
  const packed = loadPacked();
  const chips = wear.map(([e, n]) => {
    const on = packed.includes(n);
    return `<button type="button" class="chip chip-btn ${on ? 'packed' : ''}" data-item="${n}" aria-pressed="${on}">${e} ${n}</button>`;
  }).join('');

  // Tomorrow morning (06:00–09:00)
  const tomorrow = d.time[t + 1];
  const morning = h.time.map((tm, k) => [tm, k]).filter(([tm]) =>
    tm.startsWith(tomorrow) && +tm.slice(11, 13) >= 6 && +tm.slice(11, 13) <= 9).map(([, k]) => k);
  const morningMax = Math.max(...morning.map(k => h.precipitation_probability[k]));
  const morningText = morningMax >= 40
    ? `Rain possible before 9am tomorrow (up to ${morningMax}%). Pack that umbrella.`
    : `Looks mostly dry before 9am tomorrow (up to ${morningMax}% chance).`;

  // Days since it last rained
  let lastRain = 'No rain in the last 8 days';
  for (let k = i - 1; k >= 0; k--) {
    if (h.precipitation[k] >= 0.2) {
      const hrs = i - k;
      lastRain = hrs < 1 ? 'Just now' : hrs < 24 ? `${hrs} hour${hrs === 1 ? '' : 's'} ago` : `${Math.round(hrs / 24)} day${Math.round(hrs / 24) === 1 ? '' : 's'} ago`;
      break;
    }
  }

  // Hour strip (keep the selected hour if it is still in range)
  if (state.sel == null || state.sel < i || state.sel >= i + 24) state.sel = i;
  const hours = [];
  for (let k = 0; k < 24; k++) {
    const idx = i + k;
    if (idx >= h.time.length) break;
    hours.push(`<button type="button" class="hour ${idx === state.sel ? 'selected' : ''}" data-idx="${idx}">
      <span>${k === 0 ? 'Now' : hourLabel(h.time[idx])}</span>
      <div class="ico">${wx(h.weather_code[idx])[1]}</div>
      <b>${r(T(h.temperature_2m[idx]))}°</b>
      <small>${h.precipitation_probability[idx]}% rain</small>
    </button>`);
  }

  // 7-day table
  const rows = [];
  for (let k = 0; k < 7; k++) {
    const idx = t + k;
    if (d.time[idx] == null) break;
    const [txt, ico] = wx(d.weather_code[idx]);
    rows.push(`<tr>
      <td><b>${dayLabel(d.time[idx], k)}</b></td>
      <td>${ico} ${txt}</td>
      <td class="r">${r(T(d.temperature_2m_max[idx]))}° / ${r(T(d.temperature_2m_min[idx]))}°</td>
      <td class="r">${d.precipitation_probability_max[idx]}%</td>
    </tr>`);
  }

  // Umbrella call history
  const checked = calls.filter(c => c.result);
  const right = checked.filter(c => c.result === 'Right').length;
  const recent = calls.slice(-10).reverse().map(c => `
    <li><span>${hourLabel(c.key)} · ${new Date(c.key.slice(0, 10) + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })} — ${c.label}</span>
    <span class="badge ${c.result || 'Pending'}">${c.result || 'Waiting for rain data'}</span></li>`).join('');

  const sunrise = d.sunrise[t].slice(11, 16), sunset = d.sunset[t].slice(11, 16);
  const aqi = aq && aq.current ? aq.current.european_aqi : null;
  const aqText = aqi == null ? 'not available right now' : `${aqi} (${aqLabel(aqi)})`;

  $('date').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  $('app').innerHTML = `
    <section class="card hero ${v.level}">
      <div class="hero-icon ${v.level === 'take' ? 'wiggle' : v.level === 'maybe' ? 'bob' : 'spin'}" title="Tap me">${v.icon}</div>
      <div>
        <p class="eyebrow">Umbrella check · next 12 hours</p>
        <h2>${v.label}</h2>
        <p>${v.reason}</p>
        <p class="quip">“${v.quip}”</p>
      </div>
    </section>

    <section class="card">
      <p class="eyebrow">Rain timeline</p>
      <h2 style="margin:0 0 12px">Next 12 hours</h2>
      ${rainTimeline(h, i)}
    </section>

    <div class="grid two">
      <section class="card">
        <p class="eyebrow">Right now</p>
        <div class="now-main">
          <span class="big-icon">${wx(cur.weather_code)[1]}</span>
          <span class="temp" data-count="${r(T(cur.temperature_2m))}" data-suffix="${TU()}">${r(T(cur.temperature_2m))}${TU()}</span>
        </div>
        <p class="muted">${wx(cur.weather_code)[0]} · feels like ${r(T(cur.apparent_temperature))}${TU()}</p>
        <div class="stats">
          <div class="stat"><small>Humidity</small><b>${cur.relative_humidity_2m}%</b></div>
          <div class="stat"><small>Wind</small><b>${r(W(cur.wind_speed_10m))} ${WU()}</b></div>
          <div class="stat"><small>Rain now</small><b>${cur.precipitation.toFixed(1)} mm</b></div>
        </div>
        <p class="muted" style="margin:12px 0 0">Last rain: ${lastRain}</p>
      </section>

      <section class="card">
        <p class="eyebrow">What to wear</p>
        <h2 style="margin:0 0 6px">${title}</h2>
        <p class="muted">Feels like ${r(T(cur.apparent_temperature))}${TU()} now, ${r(T(minF))}° to ${r(T(maxF))}° over the next 24 hours.</p>
        <div class="chips">${chips || '<span class="muted">Nothing special needed.</span>'}</div>
        <p class="muted" style="margin:10px 0 0;font-size:.85rem">Tap an item to tick it off as packed.</p>
      </section>

      <section class="card">
        <p class="eyebrow">Tomorrow morning</p>
        <p style="margin:0">${morningText}</p>
      </section>

      <section class="card">
        <p class="eyebrow">Sun, UV and air</p>
        <div class="stats">
          <div class="stat"><small>Sunrise</small><b>${sunrise}</b></div>
          <div class="stat"><small>Sunset</small><b>${sunset}</b></div>
          <div class="stat"><small>UV index</small><b>${r(uv)} · ${uvLabel(uv)}</b></div>
        </div>
        <p class="muted" style="margin:12px 0 0">Air quality: ${aqText}${uv >= 3 ? ' · Sunscreen recommended.' : ''}</p>
      </section>
    </div>

    <section class="card">
      <p class="eyebrow">Plan ahead</p>
      <h2 style="margin:0 0 12px">Next 24 hours</h2>
      <div class="strip">${hours.join('')}</div>
      <div class="detail" id="detail">${detailHTML(data, state.sel, i)}</div>
    </section>

    <section class="card">
      <p class="eyebrow">The week ahead</p>
      <h2 style="margin:0 0 8px">7-day forecast</h2>
      <table>
        <thead><tr><th>Day</th><th>Conditions</th><th class="r">High / low</th><th class="r">Rain chance</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    </section>

    <section class="card">
      <p class="eyebrow">Your weather log</p>
      <h2 style="margin:0 0 12px">Past week and this week</h2>
      ${drawChart(d, t)}
    </section>

    <section class="card">
      <p class="eyebrow">Was my umbrella call right?</p>
      <p class="muted" style="margin-top:0">${checked.length ? `${right} of ${checked.length} checked calls were right.` : 'Calls are saved each hour and checked once the rain has happened.'}</p>
      ${calls.length ? `<ul class="log">${recent}</ul>` : '<p class="muted">No calls saved yet.</p>'}
    </section>

    <footer>Forecast and air quality data by Open-Meteo. Calls, units and packing ticks are saved in this browser only.</footer>
  `;
  animateNumbers();
}

// ---------- saved forecast (used if the weather service is down) ----------
function loadLast() {
  try { return JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch (e) { return null; }
}
function saveLast(data, aq) {
  try { localStorage.setItem(LAST_KEY, JSON.stringify({ data, aq, saved: Date.now() })); } catch (e) { /* skip */ }
}
function showUpdated(text) { $('updated').textContent = text; }

// ---------- loading ----------
async function load() {
  $('status').textContent = 'Loading the latest Leeds weather…';
  let data = null, aq = null, error = null;
  try { data = await getJSON(FC_URL); } catch (e) { error = e; console.error(e); }
  try { aq = await getJSON(AQ_URL); } catch (e) { console.error(e); }

  try {
    if (data) {
      saveLast(data, aq);
      state = { data, aq, sel: state ? state.sel : null };
      render();
      showUpdated('Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));
      $('status').textContent = aq ? '' : 'Air quality is unavailable right now. The weather is still up to date.';
      return;
    }
    const last = loadLast();
    if (last) {
      state = { data: last.data, aq: last.aq, sel: null };
      render();
      const when = new Date(last.saved).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      showUpdated('Saved forecast from ' + when);
      $('status').textContent = "Couldn't reach the weather service (" + error.message + "). Showing the last saved forecast.";
      return;
    }
    $('status').textContent = "Couldn't load the weather (" + (error ? error.message : 'unknown error') +
      "). If you're viewing this inside a chat preview, download the file and open it in your web browser instead, then press Refresh.";
  } catch (e) {
    console.error(e);
    $('status').textContent = 'Something went wrong showing the weather: ' + e.message + '. Press Refresh to try again.';
  }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const hour = e.target.closest('.hour');
  if (hour) return selectHour(+hour.dataset.idx);
  const chip = e.target.closest('.chip-btn');
  if (chip) return togglePacked(chip);
  const hero = e.target.closest('.hero-icon');
  if (hero) return burst(hero);
});
$('tempUnit').addEventListener('click', () => {
  units.temp = units.temp === 'C' ? 'F' : 'C'; saveUnits(); updateUnitButtons(); if (state) render();
});
$('windUnit').addEventListener('click', () => {
  units.wind = units.wind === 'mph' ? 'kmh' : 'mph'; saveUnits(); updateUnitButtons(); if (state) render();
});
$('refresh').addEventListener('click', load);

updateUnitButtons();
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
